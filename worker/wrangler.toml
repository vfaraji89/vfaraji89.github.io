name = "ask-my-work"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Claude Opus 5.5 by default. Change to "claude-sonnet-5-5" or "claude-haiku-5-5" to cut cost per question.
MODEL = "claude-opus-5-5"
# Hard daily spend cap in US dollars. Past it, the site answers from retrieval only.
DAILY_BUDGET_USD = "2.00"
ALLOWED_ORIGINS = "https://vfaraji89.github.io,http://localhost:8765"

# Spend counter for the daily cap. Create it with:
#   npx wrangler kv namespace create SPEND
# and paste the id below.
[[kv_namespaces]]
binding = "SPEND"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-visitor rate limit: 10 requests a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key is a secret, never a var:
#   npx wrangler secret put ANTHROPIC_API_KEY
