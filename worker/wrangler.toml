name = "ask-my-work"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Claude Haiku 5.5: the cheapest model, about $0.0005 an answer.
# For better writing at higher cost: "claude-sonnet-5-5" (~$0.006) or "claude-opus-5-5" (~$0.011).
MODEL = "claude-haiku-5-5"
# Hard daily spend cap in US dollars (about 1,000 Haiku answers). Past it, the site answers from retrieval only.
DAILY_BUDGET_USD = "0.50"
ALLOWED_ORIGINS = "https://vfaraji89.github.io,http://localhost:8765"

# Spend counter for the daily cap. Create it with:
#   npx wrangler kv namespace create SPEND
# and paste the id below.
[[kv_namespaces]]
binding = "SPEND"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-visitor rate limit: 10 requests a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key is a secret, never a var:
#   npx wrangler secret put ANTHROPIC_API_KEY
