html,body{background:var(--paper)}
.c{position:relative;overflow:hidden;background:var(--paper);font-family:"Vahid Sora",sans-serif;color:var(--ink)}

.h{font-weight:800;letter-spacing:-.045em;line-height:1.02}
.h mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);color:inherit}
.dot{color:var(--red)}
.sub{color:var(--sec)}
.stats{display:flex;gap:28px;font-family:"Geist Mono",monospace;color:var(--sec)}

.stats b.r{color:var(--red)}
.url{font-family:"Geist Mono",monospace;color:var(--deep)}
/* the abacus */
.ab{position:absolute}
.ab .post{position:absolute;top:0;bottom:0;width:22px;border-radius:999px;background:linear-gradient(90deg,#b48a5c 0%,#d8bb94 24%,#f1e3cc 48%,#dcc29e 70%,#ad8455 100%);}
.ab .rod{position:absolute;height:8px;border-radius:9px;background:linear-gradient(180deg,#e9d8bd,#f4eadb 35%,#d2b48d 75%,#b8946a)}
.ab .bead{position:absolute;border-radius:50%;}
.ab .w{background:radial-gradient(circle at 34% 28%,#fff,#f4f1ee 40%,#d9d3cd)}
.ab .r{background:radial-gradient(circle at 34% 28%,#ff8f80,#e0301e 42%,#9e1a0c)}
.ab .i{background:radial-gradient(circle at 34% 28%,#6a6a70,#1c1c1e 45%,#000)}

const MARK=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="5" stroke="#1c1c1e" stroke-width="1.5"/><path d="M5 8h14M5 12h14M5 16h14" stroke="rgba(28,28,30,0.22)" stroke-width="1"/><circle cx="7.5" cy="8" r="1.9" fill="#e0301e"/><circle cx="15.5" cy="12" r="1.9" fill="#1c1c1e"/><circle cx="9" cy="16" r="1.9" fill="#1c1c1e"/></svg>`;
// rows: arrays of [colour, side] where side 'L' = counted (left), 'R' = resting (right)
function abacus(x,y,w,h,rows,bead){
  const n=rows.length, post=22, inner=w-2*post, gap=h/(n+1);
  let html=`<div class="ab" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="post" style="left:0"></div><div class="post" style="right:0"></div>`;
  rows.forEach((row,ri)=>{
    const cy=gap*(ri+1);
    html+=`<div class="rod" style="left:${post}px;right:${post}px;top:${cy-4}px"></div>`;
    const L=row.filter(b=>b[1]==='L'), R=row.filter(b=>b[1]==='R');
    L.forEach((b,k)=>{html+=`<div class="bead ${b[0]}" style="width:${bead}px;height:${bead}px;left:${post+4+k*(bead+2)}px;top:${cy-bead/2}px"></div>`});
    R.forEach((b,k)=>{html+=`<div class="bead ${b[0]}" style="width:${bead}px;height:${bead}px;left:${w-post-4-(R.length-k)*(bead+2)+2}px;top:${cy-bead/2}px"></div>`});
  });
  return html+`</div>`;
}
