name: Secret scan

# Fails if a tracked file holds something that looks like a real key or a secrets
# file (.env, .dev.vars). Real keys live in Cloudflare Worker secrets and GitHub
# Actions secrets, never in the repository.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for secrets
        run: node tools/secret-scan.mjs
