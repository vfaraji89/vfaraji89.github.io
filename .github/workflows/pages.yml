name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "cv/**", "tools/evals/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing: a cancelled run can leave a
# Pages deployment half-open, and the next one then queues behind it until it times out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The CV is written in LaTeX (cv/vahid-faraji-cv.tex). Every deploy
      # rebuilds it, so the PDF the site links to always matches the source.
      - name: Build CV from LaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b  # v4
        with:
          root_file: vahid-faraji-cv.tex
          working_directory: cv
          # Vahid Sora is loaded from cv/fonts through fontspec, which needs XeLaTeX
          latexmk_use_xelatex: true
      - name: Publish CV PDF into the site
        run: |
          cp cv/vahid-faraji-cv.pdf site/assets/cv/vahid-faraji-cv.pdf
          # the older address, kept so links already shared keep working
          cp cv/vahid-faraji-cv.pdf site/assets/cv/01-cv-vahid-faraji-202610.pdf
      # Page images for the in-page CV preview, rendered from the same PDF.
      # Installing the renderer needs Ubuntu's package mirrors, which runners
      # sometimes cannot reach. Retry, and if it still fails keep the preview
      # images already in the repo: a slightly older preview must never block
      # a deploy.
      - name: Render CV preview pages
        run: |
          if ! command -v pdftoppm >/dev/null; then
            for try in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils && break
              echo "poppler-utils install failed (attempt $try), retrying in 20s"; sleep 20
            done
          fi
          if ! command -v pdftoppm >/dev/null; then
            echo "::warning title=CV preview not refreshed::Could not install poppler-utils; the committed preview images are published instead."
            exit 0
          fi
          for n in 1 2; do
            pdftoppm -jpeg -jpegopt quality=82,progressive=y -r 115 -f $n -l $n -singlefile \
              cv/vahid-faraji-cv.pdf site/assets/cv/vahid-faraji-cv-$n
          done
      # Evals for Ask my work and the fit brief. A score below its threshold
      # stops the deploy; the results page (site/evals.html) shows this run.
      - name: Run evals
        run: node tools/evals/run.mjs --check
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Publishing sometimes fails on GitHub's side ("try again later", or stuck
      # while updating). Give it the longest allowed wait (10 min), and retry once after a pause.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
