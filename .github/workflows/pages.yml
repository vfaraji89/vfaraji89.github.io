name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "cv/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing: a cancelled run can leave a
# Pages deployment half-open, and the next one then queues behind it until it times out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The CV is written in LaTeX (cv/vahid-faraji-cv.tex). Every deploy
      # rebuilds it, so the PDF the site links to always matches the source.
      - name: Build CV from LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: vahid-faraji-cv.tex
          working_directory: cv
          # Vahid Sora is loaded from cv/fonts through fontspec, which needs XeLaTeX
          latexmk_use_xelatex: true
      - name: Publish CV PDF into the site
        run: |
          cp cv/vahid-faraji-cv.pdf site/assets/cv/vahid-faraji-cv.pdf
          # the older address, kept so links already shared keep working
          cp cv/vahid-faraji-cv.pdf site/assets/cv/01-cv-vahid-faraji-202610.pdf
      # Page images for the in-page CV preview, rendered from the same PDF
      - name: Render CV preview pages
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          for n in 1 2; do
            pdftoppm -jpeg -jpegopt quality=82,progressive=y -r 115 -f $n -l $n -singlefile \
              cv/vahid-faraji-cv.pdf site/assets/cv/vahid-faraji-cv-$n
          done
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Publishing sometimes fails on GitHub's side ("try again later", or stuck
      # while updating). Give it longer, and retry once after a pause.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1200000
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
